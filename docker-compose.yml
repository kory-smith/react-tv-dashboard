version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # For development: mount source code for hot reloading
      - ./app:/app/app
      - ./prisma:/app/prisma
      - ./public:/app/public
    environment:
      - NODE_ENV=development
      - PORT=3000
      - SESSION_SECRET=development-secret-key-for-sessions
      - ADMIN_PASSWORD=admin-dev-password
    command: >
      sh -c "bunx prisma migrate dev --name init && bunx prisma generate && bun app/lib/seed.ts && bun run start"
    restart: unless-stopped