version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Persistent data volume for the database
      - dashboard-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=development-secret-key-for-sessions
      - ADMIN_PASSWORD=admin-dev-password
      - DATABASE_URL=file:/app/data/dev.db
    # No need for command override as we're using the entrypoint script
    restart: unless-stopped

volumes:
  dashboard-data:
    # Named volume for data persistence