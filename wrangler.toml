name = "react-tv-dashboard"
main = "src/worker.ts"
compatibility_date = "2023-09-22"

[build]
command = "bun run build"
watch_dir = "src"

[[d1_databases]]
binding = "DB"
database_name = "react_tv_dashboard"
database_id = "d2619920-dc7c-46db-ba6f-d7b68bced00b"
migrations_dir = "d1/migrations"
migrations_table = "d1_migrations"

[[kv_namespaces]]
binding = "SESSION_STORE"
id = "placeholder-id" # Replace with actual KV ID after creation

[site]
bucket = "./build/client"

[dev]
port = 8788
local_protocol = "http" 